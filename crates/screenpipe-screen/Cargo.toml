[package]
name = "screenpipe-screen"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

[dependencies]
screenpipe-a11y = { path = "../screenpipe-a11y" }
serde_json = "1.0"
chrono = { version = "0.4.31", features = ["serde"] }

# async
tokio = { workspace = true }

# Image processing
image = { workspace = true }

# OCR
# screenpipe/rusty-tesseract @ 08346c1, vendored in third_party/rusty-tesseract
rusty-tesseract = { path = "../../third_party/rusty-tesseract" }

anyhow = "1.0.86"

image-compare = "0.4.1"

# Integrations
screenpipe-connect = { path = "../screenpipe-connect" }

# Lanuage specification
screenpipe-core = { path = "../screenpipe-core" }
screenpipe-db = { path = "../screenpipe-db" }

tracing = { workspace = true }
serde = "1.0.200"

once_cell = { workspace = true }
base64 = "0.22.1"
reqwest = { workspace = true }
url = "2.5.0"

[dev-dependencies]
tempfile = "3.3.0"
tracing-subscriber = { workspace = true }
criterion = { workspace = true }
strsim = "0.10.0"
memory-stats = "1.2.0"

serde = "1.0.200"

[package.metadata.osx]
framework = ["Vision", "AppKit"]

[[bench]]
name = "ocr_benchmark"
harness = false

[[bench]]
name = "apple_leak_bench"
harness = false

[[bench]]
name = "frame_comparison_bench"
harness = false

[[bench]]
name = "multi_monitor_bench"
harness = false

# Platform-specific dependencies

# macOS: sck-rs for 12.3+ (ScreenCaptureKit), xcap as fallback for older versions
[target.'cfg(target_os = "macos")'.dependencies]
# screenpipe/sck-rs @ b7f48a1, vendored in third_party/sck-rs
sck-rs = { path = "../../third_party/sck-rs" }
xcap = "0.9"
libc = "0.2.168"
cidre = { git = "https://github.com/yury/cidre.git", rev = "8481f3f0dc7dd39bb5be80d9424bfac0cad3801a", features = ["vn", "cv", "cg", "app"] }
accessibility-sys = { git = "https://github.com/eiz/accessibility.git", rev = "173e898d4a52ee0afe0224ecb458d324057856e7" }
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "0.9", features = ["wgc"] }
uiautomation = { version = "0.16.1" }
windows = { version = "0.58", features = [
  "Graphics_Imaging",
  "Globalization",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Foundation_Collections",
  # Native Windows Graphics Capture (wgc_capture.rs) and monitor enumeration
  # (monitor/windows.rs)
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
] }

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.9"
libc = "0.2.168"
atspi = { version = "0.25.0", features = ["tokio","proxies-tokio","zbus"] }
zbus       = { version = "5.5", default-features = false }
atspi-common     = { version = "0.9.0", default-features = false }
atspi-proxies    = { version = "0.9.0", default-features = false }
