# Freenpipe — local-first screen & audio memory (fork of screenpipe @ 892199f, MIT)
# https://github.com/normiecore/Freenpipe
#
# Windows Error Reporting runtime exception helper (shell-017). WerFault.exe
# loads the DLL this crate builds when the app crashes in a way Rust's panic
# hook cannot see (stack buffer overrun, __fastfail, abort), and the DLL writes
# a minidump of the crashed process into the data directory. Nothing is ever
# uploaded. The app registers the DLL at start-up (src-tauri/src/wer.rs) and
# moves finished dumps into <data dir>/crash-dumps on the next launch.
#
# On other platforms the crate builds an empty library: only its pure layout
# and naming code exists there, so the unit tests run everywhere.
[package]
name = "screenpipe-wer-helper"
version.workspace = true
authors.workspace = true
description = "Out-of-process WER helper that writes local minidumps of Freenpipe crashes"
repository.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[lib]
# The file name the installer ships beside the app executable.
name = "screenpipe_wer_dump_helper"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
